<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON SNAKE ARCADE</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-green: #39ff14;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff00ff;
      --neon-orange: #ff6600;
      --neon-yellow: #ffff00;
      --bg: #010108;
      --grid-color: rgba(0, 243, 255, 0.04);
      --glow-green: 0 0 10px #39ff14, 0 0 20px #39ff14, 0 0 40px #39ff14;
      --glow-cyan: 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #00f3ff;
      --glow-pink: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
      user-select: none;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridPulse 4s ease-in-out infinite;
      pointer-events: none;
    }

    /* Corner scanlines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    @keyframes gridPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    #wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    #header {
      text-align: center;
    }

    #header h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      color: var(--neon-cyan);
      text-shadow: var(--glow-cyan);
      letter-spacing: 0.3em;
      animation: titlePulse 2s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { text-shadow: var(--glow-cyan); }
      50% { text-shadow: 0 0 5px #00f3ff, 0 0 10px #00f3ff; }
    }

    /* Score bar */
    #scorebar {
      display: flex;
      gap: 30px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }

    .score-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .score-label { color: rgba(0,243,255,0.5); font-size: 0.6rem; letter-spacing: 0.2em; }
    .score-value { color: var(--neon-green); text-shadow: var(--glow-green); font-size: 1.1rem; }
    .score-value.hi { color: var(--neon-yellow); text-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00; }

    /* Game container */
    #game-container {
      position: relative;
      border: 2px solid var(--neon-cyan);
      box-shadow: var(--glow-cyan), inset 0 0 30px rgba(0,243,255,0.03);
    }

    canvas {
      display: block;
      background: #050510;
    }

    /* Level badge */
    #level-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      color: var(--neon-orange);
      text-shadow: 0 0 10px var(--neon-orange);
      letter-spacing: 0.15em;
      z-index: 5;
    }

    /* Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(1, 1, 8, 0.92);
      z-index: 10;
      backdrop-filter: blur(2px);
    }

    .overlay.hidden { display: none; }

    .overlay h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1rem, 4vw, 1.6rem);
      letter-spacing: 0.25em;
      text-align: center;
    }

    .overlay p {
      font-size: 0.75rem;
      color: rgba(0,243,255,0.6);
      letter-spacing: 0.1em;
      text-align: center;
      padding: 0 20px;
    }

    .final-score {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      color: var(--neon-green);
      text-shadow: var(--glow-green);
    }

    /* Buttons */
    .btn {
      background: transparent;
      border: 2px solid var(--neon-pink);
      color: var(--neon-pink);
      padding: 10px 28px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--neon-pink);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.2s;
      z-index: -1;
    }

    .btn:hover { color: white; text-shadow: none; box-shadow: var(--glow-pink); }
    .btn:hover::before { transform: scaleX(1); }

    /* Mobile controls */
    #mobile-controls {
      display: none;
      gap: 8px;
      flex-direction: column;
      align-items: center;
      margin-top: 4px;
    }

    .ctrl-row { display: flex; gap: 8px; }

    .ctrl-btn {
      width: 52px;
      height: 52px;
      background: rgba(0,243,255,0.05);
      border: 1px solid rgba(0,243,255,0.3);
      color: var(--neon-cyan);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: all 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .ctrl-btn:active {
      background: rgba(0,243,255,0.2);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    /* Flash effect canvas */
    #flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      transition: opacity 0.1s;
    }

    /* Particles */
    #particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 7;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      animation: particleFly 0.6s ease-out forwards;
    }

    @keyframes particleFly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 480px) {
      #mobile-controls { display: flex; }
      #header h1 { font-size: 1.2rem; }
    }

    @media (hover: none) and (pointer: coarse) {
      #mobile-controls { display: flex; }
    }
  </style>
</head>
<body>
<div id="wrapper">
  <div id="header">
    <h1>◈ NEON SNAKE ◈</h1>
  </div>

  <div id="scorebar">
    <div class="score-item">
      <span class="score-label">SCORE</span>
      <span class="score-value" id="score-display">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">BEST</span>
      <span class="score-value hi" id="hi-display">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">LEVEL</span>
      <span class="score-value" id="level-display">1</span>
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="particles"></div>

    <!-- Start screen -->
    <div id="start-screen" class="overlay">
      <h2 style="color:var(--neon-cyan);text-shadow:var(--glow-cyan)">NEON SNAKE</h2>
      <p>Usa las flechas del teclado<br>o los botones de dirección</p>
      <p style="font-size:0.65rem;color:rgba(255,0,255,0.5)">Cada 5 puntos subes de nivel · Velocidad aumenta</p>
      <button class="btn" onclick="startGame()">▶ START GAME</button>
    </div>

    <!-- Game over screen -->
    <div id="gameover-screen" class="overlay hidden">
      <h2 style="color:var(--neon-pink);text-shadow:var(--glow-pink)">GAME OVER</h2>
      <div class="final-score" id="final-score">0</div>
      <p id="new-record" style="color:var(--neon-yellow);display:none;text-shadow:0 0 10px #ffff00">★ NUEVO RÉCORD ★</p>
      <p id="gameover-level"></p>
      <button class="btn" onclick="startGame()">↺ PLAY AGAIN</button>
    </div>

    <!-- Pause screen -->
    <div id="pause-screen" class="overlay hidden">
      <h2 style="color:var(--neon-yellow);text-shadow:0 0 20px #ffff00">PAUSED</h2>
      <p>Presiona P o ESC para continuar</p>
    </div>
  </div>

  <!-- Mobile controls -->
  <div id="mobile-controls">
    <div class="ctrl-row">
      <div class="ctrl-btn" id="btn-up" ontouchstart="mobileDir(0,-1)" onmousedown="mobileDir(0,-1)">▲</div>
    </div>
    <div class="ctrl-row">
      <div class="ctrl-btn" id="btn-left" ontouchstart="mobileDir(-1,0)" onmousedown="mobileDir(-1,0)">◀</div>
      <div class="ctrl-btn" id="btn-down" ontouchstart="mobileDir(0,1)" onmousedown="mobileDir(0,1)">▼</div>
      <div class="ctrl-btn" id="btn-right" ontouchstart="mobileDir(1,0)" onmousedown="mobileDir(1,0)">▶</div>
    </div>
  </div>

  <p style="font-size:0.6rem;color:rgba(0,243,255,0.25);letter-spacing:0.15em;margin-top:2px">
    P / ESC = PAUSE
  </p>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const particlesEl = document.getElementById('particles');

  const COLS = 20, ROWS = 20;
  const CELL = canvas.width / COLS; // 20px

  // Game state
  let snake, food, bonusFood, dx, dy, nextDx, nextDy;
  let score, hiScore, level, frameCount;
  let loop, paused, alive;
  let trail = [];

  // Load hi score
  hiScore = parseInt(localStorage.getItem('neonSnakeHi') || '0');
  document.getElementById('hi-display').textContent = hiScore;

  // Color scheme per level
  const LEVEL_THEMES = [
    { snake: '#39ff14', head: '#aaffaa', food: '#ff00ff', bonus: '#ffff00' },
    { snake: '#00f3ff', head: '#aaffff', food: '#ff6600', bonus: '#ffff00' },
    { snake: '#ff00ff', head: '#ffaaff', food: '#39ff14', bonus: '#ffff00' },
    { snake: '#ff6600', head: '#ffcc88', food: '#00f3ff', bonus: '#ffff00' },
    { snake: '#ffff00', head: '#ffffaa', food: '#ff00ff', bonus: '#39ff14' },
  ];

  function getTheme() {
    return LEVEL_THEMES[(level - 1) % LEVEL_THEMES.length];
  }

  function getSpeed() {
    // Base 120ms, faster per level, min 50ms
    return Math.max(50, 120 - (level - 1) * 12);
  }

  function startGame() {
    hideAllOverlays();
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    trail = [];
    dx = 1; dy = 0;
    nextDx = 1; nextDy = 0;
    score = 0;
    level = 1;
    frameCount = 0;
    bonusFood = null;
    alive = true;
    paused = false;
    updateHUD();
    spawnFood();
    if (loop) clearInterval(loop);
    loop = setInterval(gameLoop, getSpeed());
  }

  function gameLoop() {
    if (paused || !alive) return;
    frameCount++;

    // Apply queued direction
    dx = nextDx; dy = nextDy;

    const head = { x: snake[0].x + dx, y: snake[0].y + dy };

    // Wall & self collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    // Store trail for glow effect
    trail.unshift({ x: head.x, y: head.y, age: 0 });
    if (trail.length > 12) trail.pop();

    let ate = false;
    if (head.x === food.x && head.y === food.y) {
      score += level;
      ate = true;
      spawnParticles(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, getTheme().food);
      spawnFood();
      checkLevel();
    }

    if (bonusFood && head.x === bonusFood.x && head.y === bonusFood.y) {
      score += level * 3;
      ate = true;
      spawnParticles(bonusFood.x * CELL + CELL / 2, bonusFood.y * CELL + CELL / 2, '#ffff00');
      bonusFood = null;
      checkLevel();
    }

    if (!ate) snake.pop();

    // Spawn bonus food occasionally
    if (!bonusFood && frameCount % 80 === 0 && Math.random() < 0.4) {
      spawnBonusFood();
      setTimeout(() => { bonusFood = null; draw(); }, 5000);
    }

    updateHUD();
    draw();
  }

  function checkLevel() {
    const newLevel = Math.floor(score / 5) + 1;
    if (newLevel > level) {
      level = newLevel;
      clearInterval(loop);
      loop = setInterval(gameLoop, getSpeed());
      flashCanvas();
    }
  }

  function spawnFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function spawnBonusFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y) || (food.x === pos.x && food.y === pos.y));
    bonusFood = pos;
  }

  function draw() {
    const theme = getTheme();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Subtle grid
    ctx.strokeStyle = 'rgba(0,243,255,0.04)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    }
    for (let j = 0; j <= ROWS; j++) {
      ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(canvas.width, j * CELL); ctx.stroke();
    }

    // Trail glow
    trail.forEach((t, i) => {
      const alpha = (1 - i / trail.length) * 0.15;
      ctx.fillStyle = hexToRgba(theme.snake, alpha);
      ctx.fillRect(t.x * CELL, t.y * CELL, CELL - 1, CELL - 1);
    });

    // Food
    drawFood(food.x, food.y, theme.food, frameCount);

    // Bonus food
    if (bonusFood) {
      drawFood(bonusFood.x, bonusFood.y, '#ffff00', frameCount, true);
    }

    // Snake body
    snake.forEach((s, i) => {
      const isHead = i === 0;
      const color = isHead ? theme.head : theme.snake;
      const alpha = isHead ? 1 : Math.max(0.5, 1 - i * 0.015);

      // Glow shadow
      if (i < 5) {
        ctx.shadowColor = theme.snake;
        ctx.shadowBlur = isHead ? 18 : 10;
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;
      const pad = isHead ? 0 : 1;
      ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2 - 1, CELL - pad * 2 - 1);

      // Head eyes
      if (isHead) {
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        const ex = dx === 1 ? 12 : dx === -1 ? 4 : 6;
        const ey = dy === 1 ? 12 : dy === -1 ? 4 : 6;
        const ex2 = dx === 0 ? 12 : ey;
        ctx.fillRect(s.x * CELL + ex, s.y * CELL + ey, 3, 3);
        if (dx === 0) ctx.fillRect(s.x * CELL + ex2, s.y * CELL + ey, 3, 3);
      }
    });

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function drawFood(x, y, color, frame, isBonus = false) {
    const pulse = Math.sin(frame * 0.2) * 0.3 + 0.7;
    const cx = x * CELL + CELL / 2;
    const cy = y * CELL + CELL / 2;
    const r = (CELL / 2 - 3) * pulse;

    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 20 * pulse;

    if (isBonus) {
      // Star shape for bonus
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
        const angle2 = ((i * 4 + 2) * Math.PI / 5) - Math.PI / 2;
        if (i === 0) ctx.moveTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
        else ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
        ctx.lineTo(cx + (r * 0.4) * Math.cos(angle2), cy + (r * 0.4) * Math.sin(angle2));
      }
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(CELL * 0.4)}px Share Tech Mono`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('×3', cx, cy);
    } else {
      // Diamond
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(cx, cy - r);
      ctx.lineTo(cx + r, cy);
      ctx.lineTo(cx, cy + r);
      ctx.lineTo(cx - r, cy);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  function gameOver() {
    alive = false;
    clearInterval(loop);

    // Save hi score
    let isRecord = false;
    if (score > hiScore) {
      hiScore = score;
      localStorage.setItem('neonSnakeHi', hiScore);
      isRecord = true;
    }

    document.getElementById('hi-display').textContent = hiScore;
    document.getElementById('final-score').textContent = score;
    document.getElementById('gameover-level').textContent = `Alcanzaste el nivel ${level}`;

    const rec = document.getElementById('new-record');
    rec.style.display = isRecord ? 'block' : 'none';

    setTimeout(() => {
      document.getElementById('gameover-screen').classList.remove('hidden');
    }, 400);
  }

  function togglePause() {
    if (!alive) return;
    paused = !paused;
    document.getElementById('pause-screen').classList.toggle('hidden', !paused);
  }

  function hideAllOverlays() {
    ['start-screen', 'gameover-screen', 'pause-screen'].forEach(id => {
      document.getElementById(id).classList.add('hidden');
    });
  }

  function updateHUD() {
    document.getElementById('score-display').textContent = score;
    document.getElementById('level-display').textContent = level;
    document.getElementById('hi-display').textContent = hiScore;
  }

  function flashCanvas() {
    const gc = document.getElementById('game-container');
    gc.style.borderColor = '#ffff00';
    gc.style.boxShadow = '0 0 30px #ffff00, 0 0 60px #ffff00';
    setTimeout(() => {
      gc.style.borderColor = 'var(--neon-cyan)';
      gc.style.boxShadow = 'var(--glow-cyan), inset 0 0 30px rgba(0,243,255,0.03)';
    }, 600);
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 8; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI * 2 * i) / 8;
      const dist = 20 + Math.random() * 30;
      p.style.cssText = `
        left:${x}px; top:${y}px;
        background:${color};
        box-shadow:0 0 6px ${color};
        --tx:${Math.cos(angle) * dist}px;
        --ty:${Math.sin(angle) * dist}px;
      `;
      particlesEl.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }
  }

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // Keyboard controls
  window.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp':    case 'w': case 'W': if (dy === 0)  { nextDx = 0;  nextDy = -1; } e.preventDefault(); break;
      case 'ArrowDown':  case 's': case 'S': if (dy === 0)  { nextDx = 0;  nextDy = 1;  } e.preventDefault(); break;
      case 'ArrowLeft':  case 'a': case 'A': if (dx === 0)  { nextDx = -1; nextDy = 0;  } e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': if (dx === 0)  { nextDx = 1;  nextDy = 0;  } e.preventDefault(); break;
      case 'p': case 'P': case 'Escape': togglePause(); break;
      case 'Enter': if (!alive) startGame(); break;
    }
  });

  // Mobile controls
  function mobileDir(ndx, ndy) {
    if (!alive || paused) return;
    if (ndx !== 0 && dx !== 0) return;
    if (ndy !== 0 && dy !== 0) return;
    nextDx = ndx; nextDy = ndy;
  }

  // Swipe support
  let touchStartX, touchStartY;
  canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    if (!touchStartX) return;
    const dx2 = e.changedTouches[0].clientX - touchStartX;
    const dy2 = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx2) > Math.abs(dy2)) {
      mobileDir(dx2 > 0 ? 1 : -1, 0);
    } else {
      mobileDir(0, dy2 > 0 ? 1 : -1);
    }
    e.preventDefault();
  }, { passive: false });

  // Initial draw
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
</body>
</html>
